spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${TICKETIA_DB_NAME:ticketia}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${TICKETIA_DB_USER:ticketia}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${TICKETIA_DB_PASSWORD:ticketia_local}}

spring.rabbitmq.host=${TICKETIA_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${TICKETIA_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${TICKETIA_RABBITMQ_USER:ticketia}
spring.rabbitmq.password=${TICKETIA_RABBITMQ_PASSWORD:ticketia_local}

ticketia.ai.api-key=${TICKETIA_AI_API_KEY:}
ticketia.ai.model=${TICKETIA_GROQ_MODEL:openai/gpt-oss-20b}
ticketia.ai.base-url=${TICKETIA_GROQ_BASE_URL:https://api.groq.com/openai/v1}

ticketia.staff.users=${TICKETIA_STAFF_USERS:[]}

#---
spring.config.activate.on-profile=publisher
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
