name: CI

on: push

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketia_ci
          POSTGRES_USER: ticketia_ci
          POSTGRES_PASSWORD: ticketia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketia_ci -d ticketia_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: ticketia_ci
          RABBITMQ_DEFAULT_PASS: ticketia_ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ticketia_ci
          SPRING_DATASOURCE_USERNAME: ticketia_ci
          SPRING_DATASOURCE_PASSWORD: ticketia_ci
          SPRING_RABBITMQ_USERNAME: ticketia_ci
          SPRING_RABBITMQ_PASSWORD: ticketia_ci
        run: sh mvnw --batch-mode test -Dticketia.test.messaging=true

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
